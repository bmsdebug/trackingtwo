name: Track new follows

# Imported from sha-manav/tracking. A repo import copies git objects without
# emitting a push event, so Actions never indexes the workflow and the Actions
# tab reads "No workflows found". This push is what registers it.

on:
  schedule:
    # Once a day at 14:07 UTC. Each run is a single page-1 call, so cost scales
    # with frequency and nothing else -- "7 */4 * * *" or "7 * * * *" trade
    # money for a shorter worst-case delay. Expect to hear about a follow up to
    # 24h after it happens; that is the sampling interval, not a missed follow.
    # GitHub's scheduler is best-effort; observed runs land ~20-30 min late.
    - cron: "7 14 * * *"
  workflow_dispatch:
    inputs:
      full_resync:
        description: "Crawl the entire following list (slower, costs more)"
        type: boolean
        default: false
      dry_run:
        description: "Report to the log without filing an issue or writing state"
        type: boolean
        default: false
      probe:
        description: "Fetch one page and dump the raw API shape, then stop"
        type: boolean
        default: false
      check_source:
        description: "One-off lookup: does this handle... (leave blank to skip)"
        type: string
        default: ""
      check_target:
        description: "...follow this handle?"
        type: string
        default: ""
      recent_source:
        description: "One-off: list this handle's most recent follows"
        type: string
        default: ""
      recent_limit:
        description: "How many recent follows to fetch (200 per page)"
        type: string
        default: "30"
      dump_spec:
        description: "Full-list dump, e.g. alice:following,bob:followers"
        type: string
        default: ""

# Never let two runs race on the state file.
concurrency:
  group: track-follows
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Without this, a missing secret shows up as a generic red X and a
      # one-line error buried in the log. Fail loudly in the run summary
      # instead, and name the mistakes that actually cause it.
      - name: Verify API key is configured
        env:
          TWITTERAPI_IO_KEY: ${{ secrets.TWITTERAPI_IO_KEY }}
        run: |
          if [ -n "$TWITTERAPI_IO_KEY" ]; then
            echo "TWITTERAPI_IO_KEY present (${#TWITTERAPI_IO_KEY} chars)."
            exit 0
          fi
          {
            echo "## :key: \`TWITTERAPI_IO_KEY\` is not set"
            echo
            echo "The workflow cannot call the API without it. Add it here:"
            echo "**Settings -> Secrets and variables -> Actions -> New repository secret**"
            echo
            echo "If you believe you already added it, check these -- each one"
            echo "produces exactly this empty-value symptom:"
            echo "- Saved under the **Variables** tab instead of **Secrets** (separate tabs, same page)"
            echo "- Saved as an **Environment** secret rather than a **Repository** secret"
            echo "- Name mismatch: it must be exactly \`TWITTERAPI_IO_KEY\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=Missing secret::TWITTERAPI_IO_KEY is not set - see the run summary"
          exit 1

      - name: Check for new follows
        env:
          TWITTERAPI_IO_KEY: ${{ secrets.TWITTERAPI_IO_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGETS: ${{ vars.TARGETS || 'eladgil,GuptaRK22' }}
          FULL_RESYNC: ${{ inputs.full_resync }}
          DRY_RUN: ${{ inputs.dry_run }}
          PROBE: ${{ inputs.probe }}
          CHECK_SOURCE: ${{ inputs.check_source }}
          CHECK_TARGET: ${{ inputs.check_target }}
          RECENT_SOURCE: ${{ inputs.recent_source }}
          RECENT_LIMIT: ${{ inputs.recent_limit }}
          DUMP_SPEC: ${{ inputs.dump_spec }}
        run: |
          if [ -n "$DUMP_SPEC" ]; then
            # "handle:kind,handle:kind" -- kind defaults to following
            echo "$DUMP_SPEC" | tr ',' '\n' | while IFS= read -r entry; do
              [ -z "$entry" ] && continue
              h="${entry%%:*}"
              k="${entry#*:}"
              [ "$k" = "$entry" ] && k="following"
              echo "::group::$h ($k)"
              python track.py --dump "$h" --kind "$k" --out "lookups/$h-$k.csv"
              echo "::endgroup::"
            done
            exit 0
          fi
          if [ -n "$RECENT_SOURCE" ]; then
            python track.py --recent "$RECENT_SOURCE" \
              --limit "${RECENT_LIMIT:-30}" \
              --out "lookups/${RECENT_SOURCE}-recent.md"
            exit 0
          fi
          # Handles come from workflow input, so pass them as argv rather than
          # interpolating them into the command string.
          if [ -n "$CHECK_SOURCE" ] && [ -n "$CHECK_TARGET" ]; then
            python track.py --check "$CHECK_SOURCE" "$CHECK_TARGET"
            exit 0
          fi
          args=""
          if [ "$DRY_RUN" = "true" ]; then args="$args --dry-run"; fi
          if [ "$PROBE" = "true" ]; then args="$args --probe"; fi
          python track.py $args

      - name: Commit state
        if: ${{ inputs.dry_run != true && inputs.probe != true && inputs.check_source == '' }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/ lookups/ 2>/dev/null || git add state/
          if git diff --cached --quiet; then
            echo "No state change."
            exit 0
          fi
          git commit -m "state: follows checked $(date -u +%Y-%m-%dT%H:%MZ)"
          for delay in 2 4 8 16 0; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && \
              git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            [ "$delay" -eq 0 ] && break
            echo "push failed, retrying in ${delay}s"
            sleep "$delay"
          done
          echo "::error::could not push state after retries"
          exit 1
